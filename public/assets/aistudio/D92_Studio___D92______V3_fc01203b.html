function fit(r,d){if(!d)return {kind:'blue',text:'选择设备查看适配',loss:null};let ds=dims(d);if(!r.sizes.length)return {kind:'',text:'尺寸待检查',loss:null};let exact=r.sizes.find(s=>s[0]===ds[0]&&s[1]===ds[1]);let losses=r.sizes.map(s=>1-Math.min(s[0]/s[1],ds[0]/ds[1])/Math.max(s[0]/s[1],ds[0]/ds[1]));let loss=Math.min(...losses),index=losses.indexOf(loss);return {kind:exact?'ok':loss<=.05?'blue':'warn',text:exact?(r.type==='主题'?'有专属布局':'原生尺寸匹配'):loss<=.05?'轻微留边 '+(loss*100).toFixed(1)+'%':(r.type==='主题'||r.type==='时钟'?'需调整布局':'需裁剪 / 留边')+' '+Math.round(loss*100)+'%',loss,index:exact?r.sizes.indexOf(exact):index};}

function original_render(){ $('#nav').innerHTML=pages.map(([id,icon,n])=>`<button class="nav ${page===id||(page==='editor'&&id==='creator')?'active':''}" onclick="go('${id}')"><span class="ico">${icon}</span><span>${n}</span></button>`).join('');$('#crumb').textContent=pages.find(x=>x[0]===page)?.[2]||({editor:'主题编辑器',account:'个人中心',settings:'设置',guide:'规划说明'}[page]);$('#status').textContent=`${devices.filter(d=>d.online).length} 台设备已连接 · ${devices.filter(d=>d.online&&d.running).length} 台正在输出`;$('#main').innerHTML=({overview,library:()=>library(false),discover:()=>library(true),creator,editor,playlists:playlistPage,devices:devicePage,plugins,account,settings:settingsPage,guide}[page]||overview)()}
function overview(){return heading('你的屏幕，各有精彩','独立管理每一块屏幕，让内容在合适的位置呈现。',`<button onclick="go('devices')">管理设备</button><button class="primary" onclick="go('library')">＋ 选择内容</button>`)+`<div class="grid" style="margin-bottom:23px"><div class="panel"><span class="label">已连接屏幕</span><span class="metric">${devices.filter(d=>d.online).length}</span><span class="muted"> / ${devices.length} 台</span></div><div class="panel"><span class="label">正在显示</span><span class="metric">${devices.filter(d=>d.online&&d.running).length}</span><span class="muted"> 台独立输出</span></div><div class="panel"><span class="label">我的内容</span><span class="metric">${resources.filter(r=>r.local).length}</span><span class="muted"> 项 · 跨设备共享</span></div></div><div class="row between" style="margin-bottom:14px"><h2>所有屏幕</h2><span class="muted small">切换查看设备，不会打断其他屏幕</span></div><div class="grid two">${devices.length?devices.map(d=>`<div class="card"><div class="row between" style="padding:6px 5px 14px"><div><h3>${esc(d.name)}</h3><span class="small muted">${d.model} · ${sizeText(dims(d))} · ${d.rot%180?'竖屏':'横屏'}</span></div><span class="tag ${d.online?'ok':''}"><i class="dot"></i>${d.online?(d.running?'正在显示':'待机'):'未连接'}</span></div>${preview(getR(d.content),d,190)}<div class="row between card-body"><div><h3>${getR(d.content).name}</h3><span class="muted small">${d.online?'USB · 独立会话':'重新连接后可恢复此内容'}</span></div><div class="row"><button class="small" onclick="detailDevice='${d.id}';go('devices')">设置</button><button class="small" ${!d.online?'disabled':''} onclick="toggleOutput('${d.id}')">${d.running?'停止输出':'恢复显示'}</button><button class="primary small" onclick="target='${d.id}';go('library')">更换内容</button></div></div></div>`).join(''):`<div class="empty"><h2>连接你的第一块 MiraBox 屏幕</h2><p>连接后确认设备身份与方向，再选择喜欢的内容。</p><button class="primary" onclick="addDevice()">体验连接设备</button><button onclick="go('discover')">先浏览资源</button></div>`}</div><div class="row between gap"><h2>常用内容</h2><button class="ghost" onclick="go('library')">查看全部 →</button></div><div class="grid gap">${resources.filter(r=>favs.includes(r.id)).map(card).join('')}</div>`}
function targetOptions(all=true){return `${all?'<option value="all">全部设备 · 查看各屏适配</option>':''}`+devices.map(d=>`<option value="${d.id}" ${target===d.id?'selected':''}>${esc(d.name)} · ${d.model} · ${sizeText(dims(d))}</option>`).join('')}
function original_card(r){return `<article class="card"><div onclick="resourceDetail(${r.id})" tabindex="0" role="button" aria-label="查看${r.name}" onkeydown="if(event.key==='Enter')resourceDetail(${r.id})">${preview(r,null,150)}</div><div class="card-body"><div class="row between"><h3>${esc(r.name)}</h3><button class="ghost small" aria-label="收藏${r.name}" onclick="favorite(${r.id})">${favs.includes(r.id)?'★':'☆'}</button></div><div class="small muted">${r.type} · ${r.sizes.map(sizeText).join(' / ')||'尺寸未知'}</div><div class="row" style="margin:10px 0;gap:5px">${target==='all'?devices.map(d=>`<span class="tag ${fit(r,d).kind}" title="${esc(d.name)}">${esc(d.name)}：${esc(fit(r,d).text)}</span>`).join(''):badge(r,currentD())}</div><div class="row between"><button class="small" onclick="resourceDetail(${r.id})">查看详情</button><button class="small ${r.local?'':'primary'}" onclick="${r.local?`applyModal(${r.id})`:`download(${r.id})`}">${r.local?'应用到 D92':'下载到资源库'}</button></div></div></article>`}
function original_library(online){let pool=resources.filter(r=>online?![1,2,4,6,7,8].includes(r.id):r.local);let base=pool.filter(r=>(type==='全部'||r.type===type)&&(!query||r.name.includes(query))&&(online||collection!=='收藏'||favs.includes(r.id))&&(online||collection!=='已下载'||downloaded.includes(r.id))&&(online||collection!=='我的创作'||r.created));let shown=base.filter(r=>target==='all'||!currentD()||filter==='all'||(filter==='fit'?fit(r,currentD()).loss!==null&&fit(r,currentD()).loss<=.05:fit(r,currentD()).loss>.05));return heading(online?'发现适合你的精彩':'我的资源',online?'按屏幕挑选内容，下载后可离线使用。':'为我的 D92 收藏壁纸、时钟与主题。',online?`<button onclick="downloads()">下载记录 · ${downloaded.length}</button>`:`<button onclick="importResource()">＋ 导入图片</button><button class="primary" onclick="newProject()">新建主题</button>`)+(online?`<div class="hero"><div><span class="tag blue">本周精选 · 示例资源</span><h2 style="margin-top:12px">给你的 D92，换一种心情</h2><p>专属主题、宽幅壁纸与竖屏内容，为你的屏幕而选。</p></div><div class="bigtime">10:24</div></div>`:`<div class="tabs">${['全部资源','收藏','已下载','我的创作'].map(t=>`<button class="${collection===t?'active':''}" onclick="collection='${t}';render()">${t}</button>`).join('')}</div>`)+`<div class="panel filters"><div class="row"><label class="small muted" for="target">目标设备</label><select id="target" onchange="target=this.value;render()">${targetOptions()}</select><select aria-label="适配范围" ${target==='all'||!devices.length?'disabled':''} onchange="filter=this.value;render()"><option value="fit" ${filter==='fit'?'selected':''}>适合当前设备</option><option value="adjust" ${filter==='adjust'?'selected':''}>需要调整</option><option value="all" ${filter==='all'?'selected':''}>全部适配情况</option></select><input class="grow" id="search" placeholder="搜索资源名称" aria-label="搜索资源" value="${esc(query)}" oninput="searchResources(this.value)"></div><div class="row"><span class="small muted">内容类型</span>${['全部','壁纸','主题','时钟','视频'].map(t=>`<button class="small ${type===t?'active':''}" onclick="type='${t}';render()">${t}</button>`).join('')}<span class="grow"></span><span class="small muted">${shown.length} 项内容</span></div></div>${base.length>shown.length?`<div class="notice warning" style="margin-bottom:18px">${base.length-shown.length} 项内容不符合当前适配筛选，仍保留在${online?'在线目录':'资源库'}中。<button class="small ghost" onclick="filter='all';render()">显示全部 →</button></div>`:''}<div class="grid resources">${shown.length?shown.map(card).join(''):'<div class="empty"><h2>没有符合筛选条件的内容</h2><p>试试全部类型或查看其他尺寸的资源。</p><button onclick="type=\'全部\';query=\'\';filter=\'all\';collection=\'全部资源\';render()">清除筛选</button></div>'}</div><div class="page-note">绿色：精确尺寸 / 专属布局　蓝色：轻微留边 ≤ 5%　黄色：需调整　灰色：尺寸未知。留边比例按完整显示时的未覆盖面积计算；不等同于清晰度或布局质量。</div>${online?'<div class="notice gap">规划范围：在线页的时钟与主题为未来分发体验示例；现有程序云端目前仅开放静态壁纸。</div>':''}`}
function searchResources(v){query=v;let pos=$('#search').selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}
function favorite(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];render()}
function download(id){getR(id).local=true;if(!downloaded.includes(id))downloaded.push(id);render();toast('示例内容已加入本次原型的资源库')}
function downloads(){modal(`<div class="modal-header"><h2>下载记录</h2><button onclick="closeModal()">关闭</button></div>${downloaded.length?downloaded.map(id=>`<div class="checkrow"><span>${getR(id).name}</span><span class="tag ok">已加入资源库</span></div>`).join(''):'<div class="empty">暂无下载记录。在发现资源中下载示例内容。</div>'}`)}
function original_resourceDetail(id){let r=getR(id);modal(`<div class="modal-header"><div><h2>${esc(r.name)}</h2><p class="small muted">${r.type} · ${r.sizes.map(sizeText).join(' / ')||'尺寸待检查'}</p></div><button onclick="closeModal()">关闭</button></div>${preview(r,null,240)}<h3 class="gap">在我的 D92 上</h3>${devices.map(d=>`<div class="checkrow"><div>${esc(d.name)}<div class="small muted">${d.model} · ${sizeText(dims(d))}</div></div>${badge(r,d)}</div>`).join('')||'<p class="muted gap">连接设备后查看适配结果。</p>'}<div class="row gap"><button onclick="favorite(${id});toast('收藏状态已更新')">${favs.includes(id)?'取消收藏':'收藏'}</button><button onclick="addToPlaylist(${id})">加入播放列表</button>${r.type==='主题'||r.type==='时钟'?`<button onclick="closeModal();openEditor(${id})">编辑布局</button>`:''}<span class="grow"></span><button class="primary" onclick="${r.local?`applyModal(${id})`:`download(${id});closeModal()`}">${r.local?'预览并应用到 D92':'下载到资源库'}</button></div>`)}
let editorBackup=null; let applying=0;
function applyModal(id){applying=id;let r=getR(id);modal(`<div class="modal-header"><div><h2>应用「${esc(r.name)}」</h2><p class="muted small">每台设备分别选择适配方式，未选设备保持原内容。</p></div><button onclick="closeModal()">关闭</button></div>${!r.sizes.length?'<div class="notice warning">尺寸未知，请先检查素材；本原型暂不允许应用。</div>':''}${devices.length?devices.map(d=>{let f=fit(r,d);return `<div class="targetrow"><input aria-label="选择${esc(d.name)}" type="checkbox" name="applyDevice" value="${d.id}" ${d.id===target&&d.online&&r.sizes.length?'checked':''} ${!d.online||!r.sizes.length?'disabled':''}><div><strong>${esc(d.name)}</strong> <span class="tag">${d.model}</span><div class="small muted">${sizeText(dims(d))} · ${d.online?'已连接':'未连接，暂不可应用'}</div><div class="row" style="margin:6px 0">${badge(r,d)}</div><select aria-label="${esc(d.name)}适配方式" id="mode-${d.id}" onchange="updateFitPreview('${d.id}')"><option value="contain">${f.loss===0?'使用匹配布局':'完整显示 · 保留全部内容'}</option>${r.type==='壁纸'||r.type==='视频'?'<option value="cover">裁切铺满 · 居中裁剪</option>':''}</select>${f.loss>.05&&(r.type==='主题'||r.type==='时钟')?'<div class="small muted">建议在编辑器创建专属布局；完整显示会留边。</div>':''}</div><div id="fit-${d.id}">${fitPreview(r,d,'contain')}</div></div>`}).join(''):'<div class="empty">请先连接设备。<br><button onclick="closeModal();addDevice()">体验连接设备</button></div>'}<div class="notice gap">横竖屏采用对应逻辑画布。此处为适配示意；点击应用只更新原型中的设备状态。</div><div class="row gap"><button onclick="closeModal()">取消</button><span class="grow"></span><button class="primary" ${!devices.some(d=>d.online)||!r.sizes.length?'disabled':''} onclick="confirmApply()">应用到所选设备</button></div>`)}
function fitPreview(r,d,mode){let ds=dims(d),index=fit(r,d).index||0,s=r.sizes[index]||ds,ratio=ds[0]/ds[1],W=Math.min(155,90*ratio),H=W/ratio,scale=mode==='cover'?Math.max(W/s[0],H/s[1]):Math.min(W/s[0],H/s[1]);return `<div class="preview" style="height:110px"><div style="width:${W}px;height:${H}px;background:#131c2d;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0"><div style="width:${s[0]*scale}px;height:${s[1]*scale}px;flex-shrink:0">${art(r,null,index)}</div></div></div>`}
function updateFitPreview(id){$('#fit-'+id).innerHTML=fitPreview(getR(applying),getD(id),$('#mode-'+id).value)}
function confirmApply(){let ids=[...document.querySelectorAll('[name=applyDevice]:checked')].map(e=>e.value);if(!ids.length)return toast('请至少选择一台已连接设备');ids.forEach(id=>{let d=getD(id);d.content=applying;d.running=true;d.fit=$('#mode-'+id).value;playlists.filter(p=>p.device===id).forEach(p=>p.playing=false)});closeModal();render();modal(`<div class="modal-header"><h2>应用结果</h2><button onclick="closeModal()">关闭</button></div>${ids.map(id=>`<div class="checkrow"><span>${esc(getD(id).name)}</span><span class="tag ok">已更新演示画面</span></div>`).join('')}<div class="row gap"><span class="grow"></span><button class="primary" onclick="closeModal();go('overview')">查看所有屏幕</button></div>`)}
function toggleOutput(id){let d=getD(id);d.running=!d.running;if(!d.running)playlists.filter(p=>p.device===id).forEach(p=>p.playing=false);render();toast(`${d.name}：${d.running?'已恢复演示输出':'已停止输出，其他设备不受影响'}`)}
function devicePage(){let d=getD(detailDevice)||devices[0];return heading('设备管理','配置这台 D92 的显示方向和输出效果。',`<button onclick="toast('演示设备列表已刷新')">↻ 刷新</button><button class="primary" onclick="addDevice()">＋ 添加演示设备</button>`)+(!d?'<div class="empty"><h2>尚未连接设备</h2><p>设备会按稳定身份保存，不按插入顺序识别。</p><button onclick="addDevice()">添加第一台设备</button></div>':`<div class="split"><div>${devices.map(x=>`<div class="list-item ${x.id===d.id?'active':''}" tabindex="0" role="button" onkeydown="if(event.key==='Enter'){detailDevice='${x.id}';render()}" onclick="detailDevice='${x.id}';render()"><strong>${esc(x.name)}</strong><div class="small muted">${x.model} · ${sizeText(dims(x))}</div><span class="tag ${x.online?'ok':''}" style="margin-top:8px">${x.online?'已连接':'未连接'}</span></div>`).join('')}</div><div class="stack"><div class="panel"><div class="row between"><h2>${esc(d.name)}</h2><span class="tag">演示身份 MB-${d.id.toUpperCase()}-001</span></div><div class="gap">${preview(getR(d.content),d,210)}</div><div class="formgrid gap"><label><span class="label">设备名称</span><input id="devname" value="${esc(d.name)}" maxlength="30"></label><label><span class="label">显示方向</span><select id="rotation">${[[0,'横屏 · 0°'],[90,'竖屏 · 90°'],[180,'横屏翻转 · 180°'],[270,'竖屏翻转 · 270°']].map(([v,n])=>`<option value="${v}" ${d.rot===v?'selected':''}>${n}</option>`).join('')}</select></label><label><span class="label">原始输出尺寸</span><input value="${d.w} × ${d.h}" disabled></label><label><span class="label">当前连接</span><input value="USB · ${d.model}" disabled></label></div><div class="row gap"><button onclick="getD('${d.id}').online=!getD('${d.id}').online;render();toast('已切换演示连接状态')">模拟${d.online?'断开':'重连'}</button><span class="grow"></span><button class="primary" onclick="saveDevice('${d.id}')">保存设备设置</button></div></div><div class="panel"><h3>独立播放</h3><p class="muted small gap">当前内容：${getR(d.content).name}。更改本设备不会影响其他屏幕。</p><div class="row gap"><button onclick="target='${d.id}';go('library')">更换内容</button><button onclick="go('playlists')">设置播放列表</button><button ${!d.online?'disabled':''} onclick="toggleOutput('${d.id}')">${d.running?'停止输出':'恢复显示'}</button></div></div><details class="panel"><summary>高级设置 · 输出性能与物理屏关联</summary><div class="formgrid gap"><label><span class="label">视频模式</span><select id="quality"><option>画质优先</option><option>流畅优先</option></select></label><label><span class="label">物理屏关联组</span><input placeholder="同一屏的 USB / 系统连接使用同一名称"></label></div><p class="small muted gap">目标帧率不等于实测帧率。实际性能、连接能力应由设备能力表提供；此处仅规划设置位置。</p><button class="gap" onclick="toast('高级设置已在本次演示中确认')">确认演示设置</button></details></div></div>`)}
function saveDevice(id){let d=getD(id),name=$('#devname').value.trim();if(!name)return toast('请输入设备名称');let rot=Number($('#rotation').value),changed=rot!==d.rot;d.name=name;d.rot=rot;if(changed){d.running=false;playlists.filter(p=>p.device===id).forEach(p=>p.playing=false)}render();toast(changed?'方向已更新；请重新预览并应用内容':'设备名称已保存')}
function addDevice(){modal(`<div class="modal-header"><h2>添加演示设备</h2><button onclick="closeModal()">关闭</button></div><label class="label">设备型号</label><select id="newmodel" style="width:100%"><option>D69</option><option>D92</option><option>MiraBox 1920 × 480</option></select><label class="label gap">名称</label><input id="newname" placeholder="例如：桌面右侧屏" style="width:100%" maxlength="30"><p class="muted small gap">真实软件通过设备枚举发现硬件。本按钮仅添加原型数据。</p><button class="primary gap" onclick="confirmDevice()">添加</button>`,true)}

function original_creator(){return heading('创作中心','为这台 D92 设计横屏和竖屏布局，随摆放方向切换。',`<button class="primary" onclick="newProject()">＋ 新建主题</button>`)+`<div class="hero"><div><span class="small">CREATE YOUR SCREEN</span><h2>从灵感到屏幕</h2><p>从 D92 模板开始，也可以为同一主题补充竖屏布局。</p><button class="gap" onclick="newProject()">从空白画布开始 →</button></div><div class="bigtime">Aa</div></div><div class="row between"><h2>我的主题与示例模板</h2><span class="muted small">布局独立保存，素材统一引用</span></div><div class="grid gap">${resources.filter(r=>r.type==='主题'||r.created).map(r=>`<div class="card">${preview(r,null,155)}<div class="card-body"><h3>${esc(r.name)}</h3><p class="muted small">${r.sizes.length} 个布局 · ${r.sizes.map(sizeText).join(' / ')}</p><div class="row gap"><button class="primary small" onclick="openEditor(${r.id})">编辑主题</button><button class="small" onclick="applyModal(${r.id})">使用主题</button></div></div></div>`).join('')}</div>`}
function original_newProject(){modal(`<div class="modal-header"><h2>新建主题</h2><button onclick="closeModal()">关闭</button></div><label class="label">主题名称</label><input id="projectname" value="我的新主题" style="width:100%" maxlength="40"><label class="label gap">初始布局</label><select id="projectsize" style="width:100%"><option value="1920,462">D92 横屏 · 1920 × 462</option><option value="462,1920">D92 竖屏 · 462 × 1920</option></select><button class="primary gap" onclick="createProject()">创建并编辑</button>`,true)}

function outputPreview(height=250){let d=only(),r=outputSnapshot||getR(d.content);let result=fitPreview(r,d,d.fit||'contain');return result.replace('height:110px',`height:${height}px`).replace(/Math\.min/g,'Math.min')}
function largeOutput(){let d=only(),r=outputSnapshot||getR(d.content),ds=dims(d),index=fit(r,d).index||0,s=r.sizes[index]||ds;let W=ds[0]>ds[1]?760:82,H=W/(ds[0]/ds[1]);let scale=d.fit==='cover'?Math.max(W/s[0],H/s[1]):Math.min(W/s[0],H/s[1]);return `<div class="preview"><div class="screen" style="width:${W}px;aspect-ratio:${ds[0]/ds[1]};background:#131c2d"><div class="output-art" style="width:${s[0]*scale/W*100}%;aspect-ratio:${s[0]/s[1]};flex-shrink:0">${art(r,null,index)}</div></div></div>`}
function overview(){let d=only(),r=outputSnapshot||getR(d.content),p=playlists.find(x=>x.playing);return heading('我的 D92','让这一块屏幕，成为桌面上最喜欢的角落。',`<button onclick="go('devices')">⚙ 屏幕设置</button><button class="primary" onclick="go('library')">更换屏幕内容</button>`)+`<div class="home-top"><section class="home-screen ${d.rot%180?'portrait':''}"><div class="row between"><div><h2>${esc(d.name)}</h2><span class="muted small">D92 · ${sizeText(dims(d))} · ${orientation()}</span></div><span class="tag ${d.online?'ok':'warn'}"><i class="dot"></i>${!d.online?'设备未连接':d.running?'正在显示':'输出已停止'}</span></div>${largeOutput()}<div class="preview-scale-note">${!d.online?'显示上次内容预览，重新连接后可恢复。':!d.running?'已停止发送，屏幕可能保留最后一帧。':'当前输出预览 · 按真实屏幕比例显示'}</div><div class="row between gap"><div><h3 class="now-name">${esc(r.name)}</h3><span class="muted small">${p?'来自播放列表「'+esc(p.name)+'」':r.type+' · '+(d.fit==='cover'?'裁切铺满':'完整显示')}</span></div><div class="row">${r.type==='主题'?`<button onclick="openEditor(${r.id})">编辑主题</button>`:''}<button ${!d.online?'disabled':''} onclick="toggleOutput('a')">${d.running?'停止输出':'恢复显示'}</button></div></div></section><aside class="home-side"><div class="panel"><h3>从这里开始</h3><button class="quick-action" onclick="go('library')"><span class="symbol">▦</span><span>我的资源<span class="label" style="margin:0">用喜欢的内容装点屏幕</span></span></button><button class="quick-action" onclick="go('discover')"><span class="symbol">◇</span><span>发现新内容<span class="label" style="margin:0">为 D92 挑选宽幅与竖屏作品</span></span></button><button class="quick-action" onclick="newProject()"><span class="symbol">✎</span><span>创作自己的主题<span class="label" style="margin:0">从 ${orientation()} 画布开始</span></span></button></div><div class="panel gap"><h3>当前播放</h3><p class="muted small gap">${p?'轮播中 · '+p.items.length+' 项内容':'固定显示当前内容'}</p><button class="fullwidth gap" onclick="go('playlists')">${p?'管理当前播放列表':'设置壁纸与主题轮播'}</button><div class="divider"></div><div class="row between"><span class="muted small">屏幕方向</span><strong>${orientation()}</strong></div><button class="ghost small" style="margin-top:7px;padding-left:0" onclick="go('devices')">调整显示方向 →</button></div></aside></div>${!d.online?'<div class="notice warning gap">D92 已断开。你的内容和设置仍保留。<button class="small" onclick="connection()">模拟重新连接</button></div>':''}<div class="row between gap"><h2>最近使用</h2><button class="ghost" onclick="collection='全部资源';go('library')">查看资源库 →</button></div><div class="grid gap">${recent.map(getR).filter(Boolean).map(card).join('')}</div><div class="home-links"><button onclick="collection='收藏';go('library')">☆ 我的收藏<span>${favs.length} 项喜欢的内容</span></button><button onclick="go('creator')">✎ 我的创作<span>为横屏和竖屏制作不同布局</span></button><button onclick="go('discover')">↓ 获取更多<span>下载后可在本地资源库使用</span></button></div>`}
function library(online){target='a';let out=original_library(online);out=out.replace(/<label class="small muted" for="target">[\s\S]*?<\/select>/,`<div class="single-device"><span>▱</span><strong>${deviceLabel()}</strong><button class="small ghost" onclick="go('devices')">调整方向</button></div>`);out=out.replaceAll('适合当前设备','适合当前 D92').replaceAll('有专属布局','D92 专属布局');return out}
function creator(){let out=original_creator();return out.replace('我的主题与示例模板','我的主题与 D92 模板').replace('布局独立保存，素材统一引用','可为同一个主题分别设计横屏和竖屏')}
function resourceDetail(id){original_resourceDetail(id);let dialog=$('#dialog');dialog.innerHTML=dialog.innerHTML.replace('选择设备并应用','预览并应用到 D92').replace('在你的设备上','在我的 D92 上');}
function newProject(){original_newProject();$('#projectsize').value=only().rot%180?'462,1920':'1920,462'}
function openEditor(id){original_openEditor(id);let r=getR(id),idx=fit(r,only()).index||0;if(idx!==0)switchLayout(idx);}
function editor(){let out=original_editor();return out.replace('修改只作用于当前主题；设备输出需单独应用。','编辑完成后保存并应用；当前屏幕会保留此前显示的版本。').replace('设备输出','D92 输出')}
function saveEditor(){original_saveEditor()}
function applyModal(id){applying=id;let r=getR(id),d=only(),f=fit(r,d);modal(`<div class="modal-header"><div><h2>应用到我的 D92</h2><p class="small muted">${deviceLabel()}</p></div><button onclick="closeModal()">关闭</button></div><div class="row between"><h3>${esc(r.name)}</h3>${badge(r,d)}</div><div class="fit-summary gap"><div><span class="label">原始内容 · ${r.sizes.map(sizeText).join(' / ')||'尺寸未知'}</span>${preview(r,null,210)}</div><div><span class="label">在 D92 上的效果 · ${sizeText(dims(d))}</span><div id="fit-a">${fitPreview(r,d,'contain')}</div></div></div><div class="row gap"><label for="mode-a" class="small muted">显示方式</label><select id="mode-a" onchange="updateFitPreview('a')"><option value="contain">${f.loss===0?'使用 D92 匹配布局':'完整显示 · 保留全部内容'}</option>${r.type==='壁纸'||r.type==='视频'?'<option value="cover">裁切铺满 · 居中裁剪</option>':''}</select></div>${f.loss>.05?`<div class="notice warning gap">${r.type==='主题'||r.type==='时钟'?'这份主题没有匹配当前方向的 D92 布局。完整显示会留边；建议先创建适合的布局。':'原图与 D92 的比例不同。完整显示会留边，裁切铺满会移除部分画面。'}</div>`:''}${!r.sizes.length?'<div class="notice warning gap">内容尺寸未知，请先检查素材，暂不可应用。</div>':''}${!d.online?'<div class="notice warning gap">D92 未连接。请在屏幕设置中连接设备后重试。</div>':''}<div class="row gap"><button onclick="closeModal()">取消</button>${r.type==='主题'||r.type==='时钟'?`<button onclick="closeModal();openEditor(${id})">编辑布局</button>`:''}<span class="grow"></span><button class="primary" ${!d.online||!r.sizes.length?'disabled':''} onclick="confirmApply()">应用到 D92</button></div><p class="small muted gap">此操作仅更新演示画面，不会连接真实硬件。</p>`)}
function confirmApply(){let d=only(),r=getR(applying);if(!d.online||!r.sizes.length)return toast('设备或内容暂不可用');d.content=applying;d.running=true;d.fit=$('#mode-a').value;outputSnapshot=structuredClone(r);playlists.forEach(p=>p.playing=false);recent=[r.id,...recent.filter(x=>x!==r.id)].slice(0,3);closeModal();render();modal(`<div class="modal-header"><h2>已应用到我的 D92</h2><button onclick="closeModal()">关闭</button></div><div class="notice">${esc(r.name)} · ${orientation()} · ${sizeText(dims(d))}</div><p class="muted gap">当前屏幕已切换到所选内容。${d.fit==='cover'?'已使用裁切铺满。':'已使用完整显示。'}</p><div class="row gap"><button onclick="closeModal()">继续浏览</button><span class="grow"></span><button class="primary" onclick="closeModal();go('overview')">查看我的屏幕</button></div>`)}
function devicePage(){let d=only();return heading('屏幕设置','配置我的 D92，内容与设置会随这台设备保留。')+`<div class="single-device-panel stack"><div class="panel"><div class="row between"><div class="row"><span class="logo">▱</span><div><h2>${esc(d.name)}</h2><span class="muted small">MiraBox D92 · USB 直连</span></div></div><span class="tag ${d.online?'ok':'warn'}">${d.online?'已连接':'等待重连'}</span></div><div class="compact-stats"><div><span class="label">当前画布</span><strong>${sizeText(dims(d))}</strong></div><div><span class="label">显示方向</span><strong>${orientation()}</strong></div><div><span class="label">设备身份</span><strong style="font-size:15px">D92-DEMO-001</strong></div></div><div class="divider"></div><div class="formgrid"><label><span class="label">设备名称</span><input id="devname" maxlength="30" value="${esc(d.name)}"></label><label><span class="label">显示方向</span><select id="rotation" onchange="orientationDraft()">${[[0,'横屏 · 1920 × 462'],[90,'竖屏 · 462 × 1920'],[180,'横屏翻转 · 180°'],[270,'竖屏翻转 · 270°']].map(([v,n])=>`<option value="${v}" ${d.rot===v?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="notice gap" id="rotationNote">保存方向后，资源库会自动按新的画布筛选；不会拉伸原主题。</div><div class="row gap"><span class="grow"></span><button class="primary" onclick="saveDevice('a')">保存屏幕设置</button></div></div><div class="panel"><h2>连接与恢复</h2><label class="checkrow"><span>重连后恢复上次内容<span class="label" style="margin:0">仅恢复同一台 D92，不应用到其他设备</span></span><input type="checkbox" ${restoreOnReconnect?'checked':''} onchange="restoreOnReconnect=this.checked"></label><div class="row gap"><span class="small muted grow">原型调试：模拟插拔，检查离线提示与恢复流程。</span><button onclick="connection()">模拟${d.online?'断开':'重新连接'}</button></div></div><details class="panel"><summary>高级输出设置</summary><div class="formgrid gap"><label><span class="label">视频偏好</span><select><option>画质优先</option><option>流畅优先</option></select></label><label><span class="label">输出方向</span><input disabled value="由上方显示方向统一管理"></label></div><p class="small muted gap">视频目标帧率和实际能力需要通过设备验证。此处只演示设置位置，不发送参数。</p><button class="gap" onclick="toast('视频偏好已确认（界面演示）')">确认演示设置</button></details></div>`}
function orientationDraft(){let v=Number($('#rotation').value);$('#rotationNote').textContent=v===only().rot?'方向未改变。':'保存后将暂停输出，并切换到'+(v%180?'462 × 1920 竖屏':'1920 × 462 横屏')+'画布。请重新预览并应用合适内容。'}
function saveDevice(){let d=only(),name=$('#devname').value.trim();if(!name)return toast('请输入设备名称');let rot=Number($('#rotation').value),changed=rot!==d.rot;d.name=name;d.rot=rot;if(changed){d.running=false;playlists.forEach(p=>p.playing=false);filter='fit'}render();toast(changed?'方向已保存，请重新选择并应用适配内容':'屏幕设置已保存')}
function connection(){let d=only();d.online=!d.online;if(!d.online){d.running=false;playlists.forEach(p=>p.playing=false)}else d.running=restoreOnReconnect;render();toast(d.online?(restoreOnReconnect?'同一台 D92 已重连，已恢复上次内容':'D92 已重连，可手动恢复显示'):'D92 已断开，保留上次内容与设置')}
function toggleOutput(){let d=only();if(!d.online)return toast('D92 尚未连接');d.running=!d.running;if(!d.running)playlists.forEach(p=>p.playing=false);render();toast(d.running?'已恢复 D92 演示输出':'已停止发送，屏幕可能保留最后一帧')}
function playlistPage(){let out=original_playlistPage();out=out.replace('壁纸、视频和主题放在一起；每台设备独立播放。','让喜欢的壁纸、视频和主题，在我的 D92 上轮流显示。');out=out.replace(/<label class="small muted">输出设备<\/label><select[\s\S]*?<\/select>/,`<div class="single-device">▱ ${deviceLabel()}</div>`);out=out.replace('停止输出请到对应设备操作。','停止输出可返回“我的屏幕”操作。');return out}
function togglePlaylist(){let p=playlists[selectedPlaylist],d=only();if(!d.online)return toast('请先连接 D92');if(!p.items.length)return toast('请先添加内容');if(p.playing){p.playing=false;render();return}let incompatible=p.items.some(x=>fit(getR(x.id),d).loss>.05||fit(getR(x.id),d).loss===null);if(incompatible){modal(`<h2>列表中有需适配的内容</h2><p class="muted gap">部分内容没有适合 D92 当前方向的布局。继续时统一完整显示，可能出现留边；也可以返回调整内容。</p><div class="row gap"><button onclick="closeModal()">返回调整</button><button class="primary" onclick="closeModal();startSinglePlaylist()">完整显示并开始</button></div>`,true);return}startSinglePlaylist()}
function startSinglePlaylist(){let p=playlists[selectedPlaylist],d=only();playlists.forEach(x=>x.playing=false);p.playing=true;p.device='a';d.content=p.items[p.at].id;d.fit='contain';d.running=true;outputSnapshot=structuredClone(getR(d.content));render()}
function nextPlaylist(){let p=playlists[selectedPlaylist],d=only();if(!d.online)return toast('D92 已断开');if(!p.items.length||!p.playing)return;p.at=(p.at+1)%p.items.length;d.content=p.items[p.at].id;outputSnapshot=structuredClone(getR(d.content));render()}
function guide(){return heading('单台 D92 · 完整页面规划','用户只有一台设备时，操作应直接、清楚，不承担多设备管理的复杂度。')+`<div class="panel"><h2>用户每天的三条路径</h2><div class="plans gap"><div class="panel"><h3>换一个画面</h3><p class="muted gap">我的屏幕 → 我的资源 → 预览 D92 适配 → 应用。</p></div><div class="panel"><h3>做自己的主题</h3><p class="muted gap">创作中心 → 选择 D92 横屏或竖屏 → 编辑 → 保存并使用。</p></div><div class="panel"><h3>让内容轮流播放</h3><p class="muted gap">播放列表 → 添加内容 → 调整顺序和时长 → 开始。</p></div></div></div><div class="panel gap"><h2>完整页面</h2><table class="table gap"><thead><tr><th>页面</th><th>单设备体验</th><th></th></tr></thead><tbody>${[...pages,['account','◎','个人中心'],['settings','⚙','设置']].map(([id,icon,n],i)=>`<tr><td>${n}</td><td>${['以当前画面为主，不显示多设备数量仪表盘','默认适配当前 D92 方向，可主动查看其他尺寸','只展示当前屏幕的适配标签，不要求选择型号','新建默认使用当前 D92 方向；支持横竖两个布局','播放目标固定为我的 D92，不重复选择设备','一台设备一份配置，方向修改后引导重新适配','内置组件统一配置，进入主题中使用','本地访客与在线账号入口分开说明','启动行为、数据与备份、版本及诊断'][i]}</td><td><button class="small" onclick="go('${id}')">查看</button></td></tr>`).join('')}</tbody></table></div><div class="grid two gap"><div class="panel"><h2>仍可看到其他分辨率资源</h2><p class="muted gap">默认“适合当前 D92”。切换“全部适配情况”可看到 D69 或其他尺寸内容，明确标记留边或需要重新排版。筛选只隐藏内容，不删除用户资源。</p></div><div class="panel"><h2>横屏与竖屏</h2><p class="muted gap">D92 横屏为 1920 × 462，竖屏为 462 × 1920。切换方向先保存设置，再选择对应内容；横屏主题不会直接拉伸为竖屏。</p></div></div><div class="notice gap">这是独立的单设备 HTML 原型，保留全部页面。设备输出、下载、账号、插件行情均为演示；编辑器不包含完整自由拖拽功能。刷新恢复初始状态。</div>`}
// Make the first-time single-device flow start from a clean horizontal D92.
target='a';detailDevice='a';playlists.forEach(p=>p.device='a');

render();
</script></body></html>
